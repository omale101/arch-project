{% load static %}
<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
        <title>ArchApp - Single Post</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        
        <link rel="stylesheet" href="{% static 'archapp/css/bootstrap.min.css' %}">
        <link rel="stylesheet" href="{% static 'archapp/css/bootstrap-theme.min.css' %}">
        <link rel="stylesheet" href="{% static 'archapp/css/fontAwesome.css' %}">
        <link rel="stylesheet" href="{% static 'archapp/css/light-box.css' %}">
        <link rel="stylesheet" href="{% static 'archapp/css/templatemo-style.css' %}">

        <link href="https://fonts.googleapis.com/css?family=Kanit:100,200,300,400,500,600,700,800,900" rel="stylesheet">
        <script src="{% static 'archapp/js/vendor/modernizr-2.8.3-respond-1.4.2.min.js' %}"></script>

        <style>
            .page-heading {
                background-image: url("{% static 'archapp/img/blog-heading-bg.jpg' %}");
                background-size: cover;
                background-repeat: no-repeat;
                background-position: center center;
            }
        </style>
    </head>

<body>

    <nav>
        <div class="logo">
            <a href="{% url 'index' %}">Arch<em>App</em></a>
        </div>
      <div class="menu-icon">
        <span></span>
      </div>
    </nav>

    <section class="overlay-menu">
      <div class="container">
        <div class="row">
          <div class="main-menu">
              <ul>
                  <li><a href="{% url 'index' %}">Home</a></li>
                  <li><a href="{% url 'about' %}">About Us</a></li>
                  <li><a href="{% url 'blog' %}">Blog Entries</a></li>
                  <li><a href="{% url 'grid' %}">Grid Layout</a></li>
                  <li><a href="{% url 'masonry' %}">Masonry Layout</a></li>
              </ul>
          </div>
        </div>
      </div>
    </section>

    <div class="page-heading">
        <div class="container">
            <div class="heading-content">
                <h1>Blog <em>Post</em></h1>
            </div>
        </div>
    </div>

    <div class="blog-entries">
        <div class="container">
            <div class="col-md-12">
                <div class="single-blog-post">
                    <img src="{% static 'archapp/img/blog_post_1.png' %}" alt="">
                    <div class="text-content">
                        <h2>Architecture: The Final Build</h2>
                        <p>This is where your architectural story goes. From the blueprint to the final brick.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer>
        <div class="container-fluid">
            <div class="col-md-12">
                <p>Copyright &copy; 2026 ArchApp | Designed by TemplateMo</p>
            </div>
        </div>
    </footer>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.11.2/jquery.min.js"></script>
    <script src="{% static 'archapp/js/vendor/bootstrap.min.js' %}"></script>
    <script src="{% static 'archapp/js/plugins.js' %}"></script>
    <script src="{% static 'archapp/js/main.js' %}"></script>

    <script>
        $(document).ready(function() {
            $(".menu-icon").unbind('click').on("click", function() {
                $(this).toggleClass("active");
                $(".overlay-menu").toggleClass("open");
            });
        });
    </script>
</body>
</html>
